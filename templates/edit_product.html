{% extends 'base.html' %}
{% block title %}Edit Product{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 720px;">
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <h1 class="h3 mb-4">Edit Product</h1>
            <form method="post" action="{{ url_for('edit_product', product_id=product[0]) }}">
                <div class="mb-3">
                    <label class="form-label" for="editCategory">Category</label>
                    <select class="form-select" id="editCategory" name="c_id" required>
                        {% for category in categories %}
                        <option value="{{ category[0] }}" {% if category[0] == product[1] %}selected{% endif %}>{{ category[1] }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="editName">Product Name</label>
                    <input class="form-control" id="editName" name="p_name" value="{{ product[2] }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="editSpecification">Specification</label>
                    <input class="form-control" id="editSpecification" name="spec" value="{{ product[3] or '' }}">
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3"><label class="form-label" for="editBuyingPrice">Buying Price</label><input class="form-control" type="number" min="0" step="0.01" id="editBuyingPrice" name="b_price" value="{{ product[4] }}" required></div>
                    <div class="col-md-4 mb-3"><label class="form-label" for="editSellingPrice">Selling Price</label><input class="form-control" type="number" min="0" step="0.01" id="editSellingPrice" name="s_price" value="{{ product[5] }}" required></div>
                    <div class="col-md-4 mb-3"><label class="form-label" for="editQuantity">Initial Quantity</label><input class="form-control" type="number" min="0" step="0.01" id="editQuantity" name="q_added" value="{{ product[6] }}" required></div>
                </div>
                <div class="d-flex gap-2 justify-content-end">
                    <a class="btn btn-outline-secondary" href="{{ url_for('products') }}">Cancel</a>
                    <button class="btn btn-primary" type="submit">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
